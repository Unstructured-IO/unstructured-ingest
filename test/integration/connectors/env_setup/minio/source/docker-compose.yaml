services:
  # run an S3 instance (minio)
  s3:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:154067bb87d1e204b1ae4c74e85b9ccee021f6833035f140d5328331dca945ed
    container_name: minio-server
    ports:
      - ${S3_API_PORT}:${S3_API_PORT}
      - ${S3_WEB_PORT}:${S3_WEB_PORT}
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_SERVER_URL: ${S3_ENDPOINT_URL}
      MINIO_BROWSER_REDIRECT_URL: ${S3_WEB_URL}
    command: server /data --address ":${S3_API_PORT}" --console-address ":${S3_WEB_PORT}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 1s
    restart: always

  # create the bucket
  seed:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:3821d1d13eeed245d780432596c41e5a8632aef6ea61f841e3da870c2518db01
    container_name: minio-client
    env_file: .env
    volumes:
      - ./seed.sh:/init/seed.sh
      - ./wiki_movie_plots_small.csv:/init/wiki_movie_plots_small.csv
    depends_on:
      s3:
        condition: service_healthy
    network_mode: service:s3
    entrypoint: /init/seed.sh
        
