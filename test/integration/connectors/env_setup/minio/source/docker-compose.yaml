services:
  # run an S3 instance (RustFS, S3-compatible)
  s3:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: minio-server
    ports:
      - ${S3_API_PORT}:${S3_API_PORT}
      - ${S3_WEB_PORT}:${S3_WEB_PORT}
    env_file: .env
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":${S3_API_PORT}"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":${S3_WEB_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_API_PORT}/health"]
      interval: 5s
      timeout: 1s
    restart: always

  # create the bucket
  seed:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:3821d1d13eeed245d780432596c41e5a8632aef6ea61f841e3da870c2518db01
    container_name: minio-client
    env_file: .env
    volumes:
      - ./seed.sh:/init/seed.sh
      - ./wiki_movie_plots_small.csv:/init/wiki_movie_plots_small.csv
    depends_on:
      s3:
        condition: service_healthy
    network_mode: service:s3
    entrypoint: /init/seed.sh
        
